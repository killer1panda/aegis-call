# ==============================================================================
# 🛡️ AegisCall Production Coturn Hardened Configuration
# Conforms to RFC 5766 (TURN), RFC 5389 (STUN), RFC 6156 (IPv6)
# ==============================================================================

# Realm & Identity
realm=turn.aegiscall.io
server-name=aegis-turn-relay-01

# Ports
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Authentication & Ephemeral Credentials (RFC 5766 REST API)
lt-cred-mech
use-auth-secret
static-auth-secret=aegis-dev-ephemeral-turn-secret-change-in-prod

# Network Hardening & Anti-Abuse Controls
fingerprint
no-loopback-peers
no-multicast-peers
stale-nonce=600
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300

# TLS 1.3 Hardening & Forward Secrecy Ciphers
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305"

# Logging & Monitoring
verbose
syslog
no-stdout-log
